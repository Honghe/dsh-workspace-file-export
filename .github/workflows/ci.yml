name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  client-artifact:
    name: client.js is in sync with src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client bundle
        run: pnpm run build

      - name: Fail when committed client.js is stale
        run: git diff --exit-code -- client.js
